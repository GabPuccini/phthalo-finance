<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phthalo Finance</title>
<meta name="description" content="A private net worth and savings tracker that keeps all of its data on your own device.">
<meta name="theme-color" content="#0F1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phthalo">
<meta name="color-scheme" content="dark light">

<!-- Every path is relative so the app works from a project subfolder. -->
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css">

<script>
  /* Resolve the saved theme before the first paint so there is no flash.
     Kept inline and tiny on purpose. Dark is used unless the system or the
     saved setting asks for light. */
  (function () {
    var resolved = 'dark';
    try {
      var raw = localStorage.getItem('phthalo.finance.v1');
      var setting = 'system';
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.settings && parsed.settings.theme) setting = parsed.settings.theme;
      }
      resolved = setting;
      if (setting !== 'light' && setting !== 'dark') {
        resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
          ? 'light' : 'dark';
      }
    } catch (error) {
      resolved = 'dark';
    }
    document.documentElement.setAttribute('data-theme', resolved);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', resolved === 'light' ? '#F2F3F6' : '#0F1013');
  }());
</script>
</head>
<body>

<header class="appbar" id="appbar">
  <div class="shell appbar-inner">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true"></span>Phthalo</h1>
    <div class="appbar-actions">
      <button type="button" class="icon-button" data-action="refresh-prices"
              aria-label="Refresh unit prices from the internet" title="Refresh prices">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button type="button" class="icon-button" data-action="toggle-theme"
              aria-label="Switch between the light and dark theme" title="Switch theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<div class="shell">
  <div class="banner-area" id="banners" role="status" aria-live="polite"></div>
</div>

<main class="shell" id="main">
  <section id="view-home" class="view" aria-label="Home"></section>
  <section id="view-insights" class="view" aria-label="Insights" hidden></section>
  <section id="view-activity" class="view" aria-label="Activity" hidden></section>
  <section id="view-settings" class="view" aria-label="Settings" hidden></section>
  <section id="view-account" class="view" aria-label="Account" hidden></section>
</main>

<button type="button" class="fab" id="fab" data-action="fab" aria-label="Add an entry">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
    <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
  </svg>
</button>

<nav class="tabbar" id="tabbar" aria-label="Main">
  <button type="button" data-action="go" data-view="home" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
      <path d="M4 19V9.5L12 4l8 5.5V19a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z" stroke-linejoin="round"/>
    </svg>
    <span>Home</span>
  </button>
  <button type="button" data-action="go" data-view="insights">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
      <path d="M5 20V11M12 20V5M19 20v-6" stroke-linecap="round"/>
    </svg>
    <span>Insights</span>
  </button>
  <button type="button" data-action="go" data-view="activity">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
      <path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" stroke-linecap="round"/>
    </svg>
    <span>Activity</span>
  </button>
  <button type="button" data-action="go" data-view="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
    </svg>
    <span>Settings</span>
  </button>
</nav>

<div class="sheet-backdrop" id="sheet-backdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></div>
</div>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>

<div class="recovery" id="recovery" hidden>
  <div class="recovery-inner">
    <h2>Something went wrong</h2>
    <p id="recovery-message">The app hit an unexpected problem. Your saved data has not been touched.
      Export a copy before you do anything else, then reload the page.</p>
    <div class="button-row">
      <button type="button" class="button is-primary" data-action="recovery-export">Export a backup</button>
      <button type="button" class="button" data-action="recovery-reload">Reload the app</button>
    </div>
    <details>
      <summary>Technical detail</summary>
      <pre id="recovery-detail"></pre>
    </details>
  </div>
</div>

<noscript>
  <div class="shell" style="padding-top:24px">
    <p>Phthalo Finance needs JavaScript to work. Everything runs on your own device and nothing
      is sent anywhere, but the app cannot draw the charts without it.</p>
  </div>
</noscript>

<script type="module" src="./src/app.js"></script>
<script>
  /* One time repair. A copy installed before October 2026 has a service
     worker that served the page from the network but the scripts from its
     cache, so on its first visit after an update it can pair this page with
     old scripts. If the app's own code has not started once the page has
     loaded, unregister the old worker, clear the app's caches and reload
     once, which fetches files that match. Saved data lives in localStorage
     and is never touched. */
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (document.documentElement.getAttribute('data-app') === 'ready') return;
      try {
        if (sessionStorage.getItem('phthalo.repaired')) return;
        sessionStorage.setItem('phthalo.repaired', '1');
      } catch (error) { return; }
      var jobs = [];
      if (navigator.serviceWorker) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (list) {
          return Promise.all(list.map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches) {
        jobs.push(caches.keys().then(function (keys) {
          return Promise.all(keys.filter(function (k) { return k.indexOf('phthalo-finance-') === 0; })
            .map(function (k) { return caches.delete(k); }));
        }));
      }
      Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
    }, 400);
  });
</script>
</body>
</html>
